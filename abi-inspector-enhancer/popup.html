<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ABI Inspector Extended</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-shell">
      <header class="brand-header">
        <img src="icons/icon-48.png" alt="" width="36" height="36" />
        <div class="brand-copy">
          <span class="eyebrow">Inspector System</span>
          <h1>ABI Inspector Extended</h1>
        </div>
        <span id="version" class="version"></span>
      </header>

      <main>
        <section class="settings-card" aria-labelledby="playbackHeading">
          <div class="section-heading">
            <span class="section-index" aria-hidden="true">01</span>
            <h2 id="playbackHeading">Playback</h2>
          </div>

          <label class="option" for="controls">
            <span class="text">
              <strong>Player controls</strong>
              <small>Seek, frame step, speed, volume, and fullscreen.</small>
            </span>
            <input id="controls" type="checkbox" role="switch" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>

          <section class="volume-setting" aria-labelledby="playerVolumeLabel">
            <div class="volume-heading">
              <label id="playerVolumeLabel" for="playerVolume">Default volume</label>
              <output id="playerVolumeValue" for="playerVolume">100%</output>
            </div>
            <small>Remembered for future inspection cases.</small>
            <input
              id="playerVolume"
              type="range"
              min="0"
              max="100"
              step="1"
              value="100"
              aria-label="Default player volume"
            />
          </section>
        </section>

        <section class="settings-card" aria-labelledby="interfaceHeading">
          <div class="section-heading">
            <span class="section-index" aria-hidden="true">02</span>
            <h2 id="interfaceHeading">Site display</h2>
          </div>
          <label class="option" for="site">
            <span class="text">
              <strong>Site modifications</strong>
              <small>Overview, tabs, sidebar, and verdict dialogs.</small>
            </span>
            <input id="site" type="checkbox" role="switch" checked />
            <span class="switch" aria-hidden="true"></span>
          </label>
        </section>
      </main>

      <footer>
        <div class="status-row">
          <p id="status" role="status" aria-live="polite"></p>
          <button id="reload" type="button" hidden>Reload page</button>
        </div>
        <div class="footer-meta">
          <span>Local preferences</span>
          <span class="credit">Made by <a href="https://github.com/mkornela" target="_blank" rel="noopener noreferrer">deem</a></span>
        </div>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
